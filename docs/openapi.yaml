openapi: 3.0.3
info:
  title: Frontend Training App API
  version: 1.0.0
  description: REST API contract required by the Vue SPA (no backend implementation here).
servers:
  - url: https://api.example.com/v1

tags:
  - name: Auth
  - name: User
  - name: Documents
  - name: Payments
  - name: Payment Methods
  - name: Invoices
  - name: Notifications
  - name: Projects
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Email is invalid
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          example: req_01HXYZ...

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds
          example: 900

    UserPublic:
      type: object
      required: [id, email, emailVerified, name]
      properties:
        id:
          type: string
          example: usr_123
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        name:
          type: string
          example: Stan
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: object
          nullable: true
          properties:
            line1: { type: string, nullable: true }
            line2: { type: string, nullable: true }
            city: { type: string, nullable: true }
            region: { type: string, nullable: true }
            postalCode: { type: string, nullable: true }
            country: { type: string, nullable: true }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password, rememberMe]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        rememberMe: { type: boolean }

    LoginResponse:
      type: object
      required: [tokens, user]
      properties:
        tokens:
          $ref: "#/components/schemas/AuthTokens"
        user:
          $ref: "#/components/schemas/UserPublic"

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code:
          type: string
          description: OTP code from email
          example: "123456"

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        address:
          $ref: "#/components/schemas/UserPublic/properties/address"

    ChangeEmailRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, format: email }

    ConfirmEmailChangeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "123456" }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    ExportRequestResponse:
      type: object
      required: [exportId]
      properties:
        exportId: { type: string, example: exp_123 }

    ExportStatus:
      type: object
      required: [exportId, status]
      properties:
        exportId: { type: string }
        status:
          type: string
          enum: [pending, ready, failed]
        downloadUrl:
          type: string
          nullable: true

    DocumentItem:
      type: object
      required: [id, fileName, mimeType, size, createdAt]
      properties:
        id: { type: string, example: doc_123 }
        fileName: { type: string, example: passport.pdf }
        mimeType: { type: string, example: application/pdf }
        size: { type: integer, example: 123456 }
        category: { type: string, enum: [general, identity], default: general }
        createdAt: { type: string, format: date-time }

    Product:
      type: object
      required: [id, title, amount, currency]
      properties:
        id: { type: string, example: prd_basic }
        title: { type: string, example: Basic Pack }
        description: { type: string, nullable: true }
        amount:
          {
            type: integer,
            example: 1999,
            description: Minor units (e.g. cents),
          }
        currency: { type: string, example: USD }
        credits:
          { type: integer, example: 5, description: Credits granted on purchase }

    CheckoutRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        promoCode: { type: string, nullable: true }

    Checkout:
      type: object
      required: [checkoutId, productId, amount, currency, status]
      properties:
        checkoutId: { type: string, example: chk_123 }
        productId: { type: string }
        amount: { type: integer }
        currency: { type: string }
        credits: { type: integer, example: 5 }
        status:
          type: string
          enum: [pending, paid, failed]
        createdAt: { type: string, format: date-time }
        paymentUrl:
          {
            type: string,
            example: "http://localhost:5173/pay/chk_123",
            description: Public payment page for this checkout,
          }
        productTitle:
          {
            type: string,
            example: Basic Pack,
            description: "Returned by GET /checkout/{checkoutId}",
          }

    PayCheckoutResponse:
      type: object
      required: [checkoutId, status]
      properties:
        checkoutId: { type: string }
        status:
          type: string
          enum: [paid, failed]
        paymentId: { type: string, nullable: true }

    Payment:
      type: object
      required: [id, checkoutId, amount, currency, status, createdAt]
      properties:
        id: { type: string, example: pay_123 }
        checkoutId: { type: string }
        amount: { type: integer }
        currency: { type: string }
        credits: { type: integer, example: 5 }
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        createdAt: { type: string, format: date-time }

    PaymentMethod:
      type: object
      required: [id, brand, last4, expMonth, expYear, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, example: pm_1a2b3c4d }
        brand: { type: string, example: Visa }
        last4: { type: string, example: "4242" }
        expMonth: { type: integer, example: 9 }
        expYear: { type: integer, example: 2028 }
        cardholderName: { type: string, nullable: true, example: Jane Doe }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePaymentMethodRequest:
      type: object
      required: [cardNumber, expMonth, expYear]
      properties:
        cardNumber:
          {
            type: string,
            example: "4242 4242 4242 4242",
            description: Full card number; only brand and last4 are stored,
          }
        cardholderName: { type: string, nullable: true }
        expMonth: { type: integer, example: 9 }
        expYear: { type: integer, example: 2028 }
        isDefault: { type: boolean }

    UpdatePaymentMethodRequest:
      type: object
      properties:
        cardholderName: { type: string, nullable: true }
        expMonth: { type: integer }
        expYear: { type: integer }
        isDefault: { type: boolean }

    BillingSummary:
      type: object
      required:
        [totalSpent, availableCredits, pendingAmount, pendingCount, currency]
      properties:
        totalSpent:
          {
            type: integer,
            example: 2999,
            description: Sum of paid payments in minor units,
          }
        availableCredits: { type: integer, example: 14 }
        pendingAmount:
          {
            type: integer,
            example: 999,
            description: Sum of pending checkouts in minor units,
          }
        pendingCount: { type: integer, example: 1 }
        currency: { type: string, example: USD }

    Invoice:
      type: object
      required: [id, paymentId, number, createdAt]
      properties:
        id: { type: string, example: inv_123 }
        paymentId: { type: string }
        number: { type: string, example: "INV-2026-0001" }
        createdAt: { type: string, format: date-time }
        downloadUrl: { type: string, nullable: true }

    PromoValidateRequest:
      type: object
      required: [code, productId]
      properties:
        code: { type: string }
        productId: { type: string }

    PromoValidateResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        discountAmount:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true

    Notification:
      type: object
      required: [id, type, title, createdAt, read]
      properties:
        id: { type: string, example: ntf_123 }
        type: { type: string, example: payment.status_updated }
        title: { type: string, example: Payment status updated }
        body: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    Project:
      type: object
      required: [id, title, status, team, createdAt, updatedAt]
      properties:
        id: { type: string, example: prj_abc123 }
        title: { type: string, example: My Project }
        status:
          type: string
          enum: [active, archived, draft]
        description: { type: string, nullable: true }
        team:
          type: array
          items: { type: string }
          description: Array of user IDs
          example: [usr_123, usr_456]
        icon: { type: string, nullable: true, example: "\uD83D\uDE80" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        status:
          type: string
          enum: [active, archived, draft]
        description: { type: string, nullable: true }
        team:
          type: array
          items: { type: string }
        icon: { type: string, nullable: true }

    UpdateProjectRequest:
      type: object
      properties:
        title: { type: string }
        status:
          type: string
          enum: [active, archived, draft]
        description: { type: string, nullable: true }
        team:
          type: array
          items: { type: string }
        icon: { type: string, nullable: true }

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AdminLoginResponse:
      type: object
      required: [accessToken, expiresIn, admin]
      properties:
        accessToken: { type: string }
        expiresIn:
          type: integer
          description: Access token TTL in seconds
        admin:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, example: adm_123 }
            email: { type: string, format: email }
            name: { type: string, example: Admin }

    CreateProductRequest:
      type: object
      required: [title, amount]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        amount:
          type: integer
          minimum: 0
          description: Minor units (e.g. cents)
        currency: { type: string, default: USD }
        credits:
          type: integer
          minimum: 0
          default: 0

    UpdateProductRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        amount:
          type: integer
          minimum: 0
          description: Minor units (e.g. cents)
        currency: { type: string }
        credits:
          type: integer
          minimum: 0

    AdminUser:
      type: object
      required: [id, email, emailVerified, name, blocked]
      properties:
        id: { type: string, example: usr_123 }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        address: { type: object, nullable: true }
        blocked: { type: boolean }

    AdminUserDetail:
      type: object
      required: [user, summary]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        summary:
          type: object
          required:
            [
              paymentsCount,
              totalSpent,
              availableCredits,
              projectsCount,
              documentsCount,
              currency,
            ]
          properties:
            paymentsCount: { type: integer, example: 2 }
            totalSpent:
              type: integer
              example: 3998
              description: Sum of paid payments in minor units
            availableCredits: { type: integer, example: 19 }
            projectsCount: { type: integer, example: 1 }
            documentsCount: { type: integer, example: 3 }
            currency: { type: string, example: USD }

    AdminUpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }

    AdminAccount:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: string, example: adm_123 }
        email: { type: string, format: email }
        name: { type: string, example: Admin }
        createdAt: { type: string, format: date-time }

    CreateAdminRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }

    AdminCheckout:
      type: object
      required: [id, checkoutId, userId, productId, amount, currency, status, createdAt]
      properties:
        id: { type: string, example: chk_123 }
        checkoutId: { type: string }
        userId: { type: string, example: usr_123 }
        userEmail: { type: string, format: email, nullable: true }
        productId: { type: string }
        productTitle: { type: string, example: Basic Pack }
        amount: { type: integer }
        currency: { type: string }
        credits: { type: integer }
        status:
          type: string
          enum: [pending, paid, failed]
        createdAt: { type: string, format: date-time }

    AdminPayment:
      type: object
      required: [id, userId, checkoutId, amount, currency, status, createdAt]
      properties:
        id: { type: string, example: pay_123 }
        userId: { type: string, example: usr_123 }
        userEmail: { type: string, format: email, nullable: true }
        checkoutId: { type: string }
        productTitle: { type: string, example: Basic Pack }
        amount: { type: integer }
        currency: { type: string }
        credits: { type: integer }
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        createdAt: { type: string, format: date-time }

    AdminInvoice:
      type: object
      required: [id, userId, paymentId, number, createdAt]
      properties:
        id: { type: string, example: inv_123 }
        userId: { type: string, example: usr_123 }
        userEmail: { type: string, format: email, nullable: true }
        paymentId: { type: string }
        number: { type: string, example: "INV-2026-0001" }
        amount: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        paymentStatus: { type: string, nullable: true, example: paid }
        createdAt: { type: string, format: date-time }
        downloadUrl: { type: string, nullable: true }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register user (email + password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend email verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (returns tokens + user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Account is blocked (USER_BLOCKED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate refresh token if supported)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset email link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password by token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me:
    get:
      tags: [User]
      summary: Get current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [User]
      summary: Update profile fields
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [User]
      summary: Delete account
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/avatar:
    post:
      tags: [User]
      summary: Upload avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/change-email:
    post:
      tags: [User]
      summary: Start email change (sends OTP to new email)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/confirm-email-change:
    post:
      tags: [User]
      summary: Confirm email change with OTP
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmEmailChangeRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/change-password:
    post:
      tags: [User]
      summary: Change password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/export:
    post:
      tags: [User]
      summary: Request data export
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportRequestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/export/{exportId}:
    get:
      tags: [User]
      summary: Get export status (and downloadUrl when ready)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/documents:
    get:
      tags: [Documents]
      summary: List user documents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string, enum: [general, identity] }
          description: Filter documents by category; omit to list all
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentItem" }
    post:
      tags: [Documents]
      summary: Upload a document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                category: { type: string, enum: [general, identity], default: general }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/documents/{documentId}:
    get:
      tags: [Documents]
      summary: Download document (or return downloadUrl)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Documents]
      summary: Delete document
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /products:
    get:
      tags: [Payments]
      summary: List products
      responses:
